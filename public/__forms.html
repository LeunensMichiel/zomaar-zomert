<!--
  Static form stub for Netlify Forms detection.

  Netlify registers forms by parsing static HTML at the end of the build. The
  real contact form is rendered client-side (components/form.tsx), so the build
  bot can't see it. This hidden replica — same form name and field names — is
  what gets detected and registered. Keep the fields in sync with FormValues.
-->
<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form
      name="contactformulier"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contactformulier" />
      <input name="bot-field" />
      <input type="text" name="naam" />
      <input type="email" name="email" />
      <input type="tel" name="telefoon" />
      <input type="text" name="onderwerp" />
      <textarea name="bericht"></textarea>
    </form>
  </body>
</html>
